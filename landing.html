<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Video Background</title>
    <style>
        /* CSS Variables for Theming */
        :root {
            --overlay-color: rgba(0, 0, 0, 0.45);
            --text-color: #ffffff;
            --accent-glow: rgba(255, 255, 255, 0.6);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-hover: rgba(255, 255, 255, 0.2);
            --fallback-bg: linear-gradient(135deg, #0f1115, #1a1c23);
        }

        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            /* Using modern sans-serif stack */
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--fallback-bg);
            color: var(--text-color);
            overflow: hidden; /* Prevent scrolling for the full-screen landing page */
        }

        /* Video Background Layer */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1; /* Changed from -2 to 1 so it sits above the body background */
            background: var(--fallback-bg); /* Fallback if video is missing */
        }

        #bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures video covers entire screen without distortion */
            object-position: center;
        }

        /* Overlays: Darkening, Vignette, and Film Grain */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--overlay-color);
            z-index: 2; /* Changed to sit above the video */
            /* Subtle vignette effect focusing the center */
            box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.85);
            pointer-events: none; /* Let clicks pass through */
        }

        /* SVG-based CSS film grain texture */
        .film-grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 3; /* Changed to sit above the overlay */
            opacity: 0.04;
            pointer-events: none;
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }

        /* Content Layer */
        .content {
            position: relative;
            z-index: 10; /* Changed to sit above everything else */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 0 24px;
        }

        .hero-title {
            font-size: clamp(3rem, 8vw, 6.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 1.25rem;
            text-shadow: 0 0 24px var(--accent-glow), 0 4px 12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 2s ease-out;
        }

        .hero-subtitle {
            font-size: clamp(1.1rem, 2.5vw, 1.5rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 3rem;
            max-width: 650px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            animation: fadeIn 2s ease-out 0.4s both;
        }

        /* Glassmorphism CTA Button */
        .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-color);
            text-decoration: none;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 9999px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            animation: fadeIn 2s ease-out 0.8s both;
            cursor: pointer;
        }

        .cta-button:hover {
            background: var(--glass-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.3), 0 0 20px rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Minimal Audio Toggle Controls */
        .controls {
            position: fixed;
            top: 32px;
            right: 32px;
            z-index: 10;
        }

        .toggle-btn {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .toggle-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Base Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Accessibility: Prefers Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            .hero-title, .hero-subtitle, .cta-button {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
            .film-grain {
                display: none; /* Can sometimes trigger motion sensitivity */
            }
        }
    </style>
</head>
<body>

    <!-- Minimal Audio Controls -->
    <div class="controls">
        <button id="mute-toggle" class="toggle-btn" aria-label="Unmute background video">
            <!-- Muted Icon (Default state since video is muted) -->
            <svg id="icon-muted" viewBox="0 0 24 24">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
            <!-- Unmuted Icon (Hidden initially) -->
            <svg id="icon-unmuted" viewBox="0 0 24 24" style="display: none;">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
        </button>
    </div>

    <!-- Background Video -->
    <div class="video-container">
        <!-- 
            INSTRUCTIONS: 
            1. Replace 'Man_gazing_into_portal.mp4' with the actual path to your video.
            2. Replace 'poster-image.jpg' with a high-quality static frame from your video.
        -->
        <video 
            id="bg-video" 
            autoplay 
            muted 
            loop 
            playsinline 
            preload="metadata"
            poster="poster.png"
        >
            <source src="video.mp4" type="video/mp4">
            <!-- Add alternative formats if available for better browser support: -->
            <!-- <source src="Man_gazing_into_portal.webm" type="video/webm"> -->
            Your browser does not support HTML5 video.
        </video>
    </div>

    <!-- Atmospheric Overlays -->
    <div class="overlay"></div>
    <div class="film-grain"></div>

    <!-- Main Content Layer -->
    <main class="content">
        <h1 class="hero-title">Beyond the Veil</h1>
        <p class="hero-subtitle">Step into a new dimension where reality fades and imagination takes control.</p>
        <a href="#explore" class="cta-button">Enter the Portal</a>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('bg-video');
            const muteToggle = document.getElementById('mute-toggle');
            const iconMuted = document.getElementById('icon-muted');
            const iconUnmuted = document.getElementById('icon-unmuted');

            // Force play on load
            video.play().catch(err => {
                console.error("Video autoplay failed:", err);
                // We won't alert here to avoid annoying popups, but it's logged
            });

            // Catch any loading errors
            video.addEventListener('error', function(e) {
                let errorMsg = "Unknown error";
                if (video.error) {
                    switch (video.error.code) {
                        case 1: errorMsg = "Aborted"; break;
                        case 2: errorMsg = "Network error"; break;
                        case 3: errorMsg = "Decode error (corrupted or unsupported format)"; break;
                        case 4: errorMsg = "Source not supported (Chrome might not like this MP4 format)"; break;
                    }
                }
                alert("Video Error: " + errorMsg + "\nCheck if the MP4 is a standard H.264 file.");
            });

            // Mute / Unmute Toggle
            muteToggle.addEventListener('click', () => {
                if (video.muted) {
                    video.muted = false;
                    iconMuted.style.display = 'none';
                    iconUnmuted.style.display = 'block';
                    muteToggle.setAttribute('aria-label', 'Mute background video');
                } else {
                    video.muted = true;
                    iconMuted.style.display = 'block';
                    iconUnmuted.style.display = 'none';
                    muteToggle.setAttribute('aria-label', 'Unmute background video');
                }
            });
        });
    </script>
</body>
</html>
