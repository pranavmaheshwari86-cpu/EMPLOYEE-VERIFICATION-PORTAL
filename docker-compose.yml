version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      JWT_SECRET: "${JWT_SECRET:-aether_jwt_secret_dev_key_only}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-aether_refresh_secret_dev_key_only}"
      FRONTEND_URL: "http://localhost:3000"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: "production"
      PORT: "5000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
